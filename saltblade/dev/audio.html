<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saltblade audio bench</title>
<style>
  :root { --bg: #14110d; --panel: #1d1812; --line: #3a3127; --text: #e9e1cf; --dim: #a39880; --accent: #d9a441; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, -apple-system, 'Segoe UI', sans-serif; }
  header { position: sticky; top: 0; z-index: 2; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; padding: 10px 16px; background: #0f0d0a; border-bottom: 1px solid var(--line); }
  header h1 { margin: 0; font-size: 16px; letter-spacing: .18em; color: var(--accent); }
  header .stat { color: var(--dim); font-variant-numeric: tabular-nums; }
  header .stat b { color: var(--text); font-weight: 600; }
  .meter { width: 160px; height: 8px; background: #2a231b; border-radius: 4px; overflow: hidden; }
  .meter i { display: block; height: 100%; width: 0; background: var(--accent); }
  main { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 12px; padding: 12px 16px 32px; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; min-width: 0; }
  h2 { margin: 0 0 8px; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
  p.hint { margin: 0 0 8px; color: var(--dim); font-size: 12px; }
  button { margin: 0 4px 5px 0; padding: 5px 9px; background: #2a231b; color: var(--text); border: 1px solid var(--line); border-radius: 5px; font: inherit; font-size: 13px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.on { background: var(--accent); border-color: var(--accent); color: #14110d; }
  label.row { display: grid; grid-template-columns: 92px 1fr 62px; align-items: center; gap: 8px; margin: 4px 0; }
  label.row span:last-child { color: var(--dim); font-variant-numeric: tabular-nums; text-align: right; }
  label.check { display: inline-flex; align-items: center; gap: 6px; margin: 6px 14px 0 0; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  input[type=checkbox] { accent-color: var(--accent); }
</style>
</head>
<body>
<header>
  <h1>SALTBLADE AUDIO</h1>
  <span class="stat">context <b id="st">not started: click or press a key</b></span>
  <span class="stat">voices <b id="vc">0</b></span>
  <span class="stat">peak <b id="pk">-inf dB</b></span>
  <div class="meter"><i id="mt"></i></div>
</header>
<main id="bench"></main>
<script type="module" src="./audio.ts"></script>
</body>
</html>
